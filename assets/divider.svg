<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .s { animation: slide 6s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-260px); } 100% { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; transform: translateX(470px); } }
  </style>
  <rect y="3" width="1200" height="2" rx="1" fill="#36BCF7" fill-opacity="0.22"/>
  <rect class="s" y="2" width="260" height="4" rx="2" fill="url(#g)"/>
</svg>
