# ============================================================================
#  GitHub Metrics — statik SVG generatoru
#  Fayl yeri (profil reponda):  .github/workflows/metrics.yml
#  Çıxış faylları:              github-stats.svg  +  github-calendar.svg
#  Bu fayllar repoya commit olunur, README onları birbaşa repodan göstərir.
# ============================================================================

name: GitHub Metrics

on:
  # Hər gün 04:00 UTC (~08:00 Bakı) avtomatik yenilənir
  schedule:
    - cron: "0 4 * * *"
  # Actions səhifəsindən əl ilə də işə salmaq üçün
  workflow_dispatch:
  # main-ə hər push-dan sonra da yenilənsin
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Əsas panel: başlıq, aktivlik, icma, repolar
  # ---------------------------------------------------------------------------
  main-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg
          user: bahramzada
          template: classic

          # --- Görünüş ---
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Baku
          config_display: large
          config_animations: yes

          # --- Dillər: notebook/markup çıxarılır, yalnız həqiqi proqram dilləri ---
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_ignored: jupyter notebook, html, css, scss, shell, makefile, dockerfile
          plugin_languages_details: percentage
          plugin_languages_limit: 8

  # ---------------------------------------------------------------------------
  # 2) İllik commit təqvimi (isometric heatmap) — push aktivliyini göstərir
  # ---------------------------------------------------------------------------
  calendar-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-calendar.svg
          user: bahramzada
          template: classic
          base: ""
          config_timezone: Asia/Baku

          # 3D illik commit təqvimi (bütün il)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
